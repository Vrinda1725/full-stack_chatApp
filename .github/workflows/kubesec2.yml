# separate terms of service, privacy policy, and support
# documentation.

name: Kubesec

on:
  push:
    branches: [ "DevOps" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "DevOps" ]
  schedule:
    - cron: '28 4 * * 3'

jobs:
  lint:
    name: Kubesec
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Kubesec
        run: |
          kubesec scan k8s/backend-deploy.yml -o json > kubesec-results.json
          jq -n --argfile input kubesec-results.json '{ "runs": [ { "results": $input } ] }' > kubesec-results.sarif

      - name: Upload Kubesec scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kubesec-results.sarif
