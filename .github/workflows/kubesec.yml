# separate terms of service, privacy policy, and support
# documentation.

name: Kubesec

on:
  push:
    branches: [ "DevOps" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "DevOps" ]
  schedule:
    - cron: '42 15 * * 1'

jobs:
  lint:
    name: Kubesec
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find YAML files
        id: find_yaml
        run: echo "yaml_files=$(find k8s -name '*.yaml' | tr '\n' ' ')" >> $GITHUB_ENV

      - name: Run kubesec scanner
        run: |
          docker run --rm -v $(pwd):/workspace controlplaneio/kubesec:v2 scan /workspace/k8s/frontend-deployment.yaml \
            --format=template --template=template/sarif.tpl --output=kubesec-results.sarif --exit-code=0

      - name: Upload Kubesec scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kubesec-results.sarif
